<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --animation-move: 40px;
      }

      body {
        background-color: rgb(63, 175, 130);
      }
      .container {
        width: 400px;
        height: 400px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .bar-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50%;
        display: flex;
        flex-direction: column;
        row-gap: 20px;
        cursor: pointer;
      }
      .bar {
        width: 100%;
        height: 20px;
        background-color: #fff;
        border-radius: 6px;
      }
      /* CSS */
      .no-animation {
        animation: none !important;
        transition: none !important;
      }

      /* active가 없을떄 */
      .bar.one {
        animation: rollbackSlideDown 1s cubic-bezier(0.3, 1, 0.7, 1) forwards;
      }
      .bar.two {
        animation: fadeIn 1s cubic-bezier(0.3, 1, 0.7, 1) forwards;
      }

      .bar.three {
        animation: rollbackSlideUp 1s cubic-bezier(0.3, 1, 0.7, 1) forwards;
      }

      /* 원래자리로 돌아오는 animation */
      @keyframes fadeIn {
        0% {
          opacity: 0;
          scale: 0;
        }

        100% {
          opacity: 1;
          scale: 1;
        }
      }

      @keyframes rollbackSlideDown {
        0% {
          transform: translate3d(0, var(--animation-move), 0) rotate(45deg);
        }
        50% {
          transform: translate3d(0, var(--animation-move), 0) rotate(0deg);
        }
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
      }

      @keyframes rollbackSlideUp {
        0% {
          transform: translate3d(0, calc(-1 * var(--animation-move)), 0)
            rotate(135deg);
        }
        50% {
          transform: translate3d(0, calc(-1 * var(--animation-move)), 0)
            rotate(0deg);
        }
        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
      }

      /* active 했을떄 */
      .active {
        & .bar.one {
          animation: slideDown 0.7s cubic-bezier(0.3, 1, 0.7, 1) forwards;
        }
        & .bar.two {
          animation: fadeOut 0.7s cubic-bezier(0.3, 1, 0.7, 1) forwards;
        }
        & .bar.three {
          animation: slideUp 0.7s cubic-bezier(0.3, 1, 0.7, 1) forwards;
        }
      }

      /* 변경되는  animation  */
      @keyframes fadeOut {
        0% {
          opacity: 1;
          scale: 1;
        }
        100% {
          opacity: 0;
          scale: 0;
        }
      }

      @keyframes slideDown {
        0% {
          transform: translate3D(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(0, var(--animation-move), 0) rotate(0deg);
        }
        100% {
          transform: translate3D(0, var(--animation-move), 0) rotate(45deg);
        }
      }

      @keyframes slideUp {
        0% {
          transform: translate3D(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(0, calc(-1 * var(--animation-move)), 0)
            rotate(0deg);
        }
        100% {
          transform: translate3d(0, calc(-1 * var(--animation-move)), 0)
            rotate(135deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="bar-container">
        <div class="bar one no-animation"></div>
        <div class="bar two no-animation"></div>
        <div class="bar three no-animation"></div>
      </div>
    </div>

    <script>
      const barContainer = document.querySelector(".bar-container");
      const barOne = document.querySelector(".bar.one");
      const barTwo = document.querySelector(".bar.two");
      const barThree = document.querySelector(".bar.three");
      const bars = document.querySelectorAll(".bar");
      barContainer.addEventListener(
        "click",
        () => {
          bars.forEach((bar) => {
            bar.classList.remove("no-animation");
          });
        },
        { once: true }
      );
      barContainer.addEventListener("click", () => {
        barContainer.classList.toggle("active");
      });
    </script>
  </body>
</html>
