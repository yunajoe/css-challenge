<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --menu-icon-line-height: 8px;
        --menu-icon-line-space: 14px;
        --menu-icon-line-offsetY: calc(
          var(--menu-icon-line-height) + var(--menu-icon-line-space)
        );
        --menu-icon-height: calc(
          3 * var(--menu-icon-line-height) + 2 * var(--menu-icon-line-space)
        );
        --cubic-bezier-in: cubic-bezier(0.3, 1, 0.7, 1);
        --cubic-bezier-out: cubic-bezier(1, 0.7, 1, 0.3);
      }

      .frame {
        position: absolute;
        box-shadow: 1px 2px 10px 0px rgba(0, 0, 0, 0.3);
        background: #3faf82;
        color: #fff;
        top: 50%;
        left: 50%;
        width: 400px;
        height: 400px;
        transform: translate(-50%, -50%);
      }
      .center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .menu-icon {
        width: 80px;
        height: var(--menu-icon-height);

        cursor: pointer;
        z-index: 50;
        .line-1,
        .line-2,
        .line-3 {
          width: 100%;
          height: var(--menu-icon-line-height);
          background-color: #fff;
          border-radius: 3px;
          box-shadow: 0 2px 10px 0 rgba(0, 0, 0, 0.3);
          transition: background-color 1s ease-in-out;
        }
        .line-1 {
          animation: animate-line-1-prev 1s ease-in-out;
        }

        .line-2 {
          margin: var(--menu-icon-line-space) 0;
          animation: animate-line-2-prev 1s ease-in-out;
        }

        .line-3 {
          animation: animate-line-3-prev 1s ease-in-out;
        }
        &:hover {
          .line-1,
          .line-2,
          .line-3 {
            background-color: #fff;
          }
        }

        &.active {
          .line-1 {
            animation: animate-line-1 1s var(--cubic-bezier-in) forwards;
          }
          .line-2 {
            animation: animate-line-2 1s var(--cubic-bezier-in) forwards;
          }
          .line-3 {
            animation: animate-line-3 1s var(--cubic-bezier-in) forwards;
          }
        }
      }

      .no-animation {
        animation: none !important;
        -webkit-animation: none !important;
      }

      /* animation 효과 */

      /* 처음 위치로 rollback 하는 애니메이션  */
      @keyframes animate-line-1-prev {
        0% {
          transform: translate3d(0, var(--menu-icon-line-offsetY), 0)
            rotate(45deg);
        }
        50% {
          transform: translate3d(0, var(--menu-icon-line-offsetY), 0) rotate(0);
        }
        100% {
          transform: rotate3d(0, 0, 0) rotate(0deg);
        }
      }

      @keyframes animate-line-2-prev {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes animate-line-3-prev {
        0% {
          transform: translate3d(0, calc(-1 * var(--menu-icon-line-offsetY)), 0)
            rotate(135deg);
        }
        50% {
          transform: translate3d(0, calc(-1 * var(--menu-icon-line-offsetY)), 0)
            rotate(0);
        }

        100% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
      }
      /* 클릭 후 X  형태로 움직이는 animation  */
      @keyframes animate-line-1 {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(0, var(--menu-icon-line-offsetY), 0) rotate(0);
        }
        100% {
          transform: translate3d(0, var(--menu-icon-line-offsetY), 0)
            rotate(45deg);
        }
      }

      @keyframes animate-line-2 {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      @keyframes animate-line-3 {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(0, calc(-1 * var(--menu-icon-line-offsetY)), 0)
            rotate(0deg);
        }
        100% {
          transform: translate3d(0, calc(-1 * var(--menu-icon-line-offsetY)), 0)
            rotate(135deg);
        }
      }
    </style>
  </head>
  <!-- 
  클릭후!
  첫번쨰: transform3d를 활용하여 y축 이동과 rotate를 이동한다.
  두번쨰: opacity 를 1에서 0으로 animation 으로 한다 
  세번쨰: transform3d를 활용하여 y축 이동과 rotate를 이동한다
  
  -->
  <body>
    <div class="frame">
      <div class="center">
        <div class="menu-icon">
          <!-- no-animation을 안쓰면은 처음부터 돌아가는 animation이 시작된다.
           단순히 처음에 animation을 막기 위한 것
          -->
          <div class="line-1 no-animation"></div>
          <div class="line-2 no-animation"></div>
          <div class="line-3 no-animation"></div>
        </div>
      </div>
    </div>
    <script>
      const menuIcon = document.querySelector(".menu-icon");
      if (menuIcon) {
        menuIcon.addEventListener("click", function () {
          const divs = this.querySelectorAll("div");
          divs.forEach((div) => {
            div.classList.remove("no-animation");
          });
          this.classList.toggle("active");
        });
      }
    </script>
  </body>
</html>
