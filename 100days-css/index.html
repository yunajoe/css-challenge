<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
      }
      .box {
        background: linear-gradient(
          to right top,
          rgb(67, 56, 159) 0%,
          rgb(78, 198, 202) 100%
        );

        width: 400px;
        height: 400px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .contents-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .number-container {
        position: relative;
        margin-bottom: 100px;
      }

      .one-part-one {
        width: 20px;
        height: 40px;
        background-color: #fff;
        transform: rotate(45deg);
        position: absolute;
        top: 0;
        left: -15px;
      }

      .one-part-two {
        width: 20px;
        height: 100px;
        background-color: #fff;
        position: absolute;
      }

      .zero-part-one {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 24px solid #fff;
        position: absolute;
        top: 0;
        left: 18px;
      }
      .zero-part-two {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 24px solid #fff;
        position: absolute;
        top: 0;
        left: 100px;
      }
      .text-one {
        font-size: 82px;
        font-weight: 700;
        text-transform: uppercase;
        color: #fff;
        margin-top: 20px;
        margin-left: -4px;
      }
      .text-two {
        font-size: 23px;
        font-weight: 700;
        text-transform: uppercase;
        color: #fff;
        letter-spacing: 2px;
        margin-top: -12px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="contents-container">
        <div class="number-container">
          <div class="one-part-one"></div>
          <div class="one-part-two"></div>
          <div class="zero-part-one"></div>
          <div class="zero-part-two"></div>
        </div>
        <p class="text-one">days</p>
        <p class="text-two">css challenge</p>
      </div>
    </div>
  </body>
</html>
