<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url(https://fonts.googleapis.com/css?family=Open+Sans:700,300);
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .frame {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 400px;
        height: 400px;
        margin-top: -200px;
        margin-left: -200px;
        border-radius: 2px;
        box-shadow: 4px 8px 16px 0 rgba(0, 0, 0, 0.1);
        overflow: hidden;
        background: #fff;
        color: #333;
        font-family: "Open Sans", Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(to top right, #43389f 0%, #4ec6ca 100%);
      }

      .center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100;
      }

      .number {
        position: relative;
        width: 200px;
        height: 100px;
      }
      .one-part-one {
        position: absolute;
        width: 20px;
        height: 40px;
        background-color: #fff;
        top: 0;
        left: 8px;
        transform: rotate(45deg);
      }

      .one-part-two {
        width: 24px;
        height: 100px;
        position: absolute;
        background-color: #fff;
        top: -1px;
        left: 20px;
        border-radius: 4px;
      }

      .zero-one {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 24px solid #fff;
        position: absolute;
        top: 0;
        left: 30px;
        z-index: 400px;
      }

      .zero-two {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 24px solid #fff;
        position: absolute;
        top: 0;
        left: 110px;
        z-index: 30px;
      }

      .days {
        color: #fff;
        font-size: 82px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .challenge {
        color: #fff;
        font-size: 23px;
        font-weight: 700;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="center">
        <div class="number">
          <div class="one-part-one"></div>
          <div class="one-part-two"></div>
          <div class="zero-one"></div>
          <div class="zero-two"></div>
        </div>
        <p class="days">days</p>
        <p class="challenge">css challenge</p>
      </div>
    </div>
  </body>
</html>
