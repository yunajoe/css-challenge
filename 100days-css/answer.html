<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .iframe {
        width: 400px;
        height: 400px;

        box-shadow: 1px 2px 10px 0px rgba(0, 0, 0, 0.3);
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -200px;
        margin-left: -200px;
        background: #43389f;
        background: -webkit-linear-gradient(
          bottom left,
          #43389f 0%,
          #4ec6ca 100%
        );
        background: -moz-linear-gradient(bottom left, #43389f 0%, #4ec6ca 100%);
        background: -o-linear-gradient(bottom left, #43389f 0%, #4ec6ca 100%);
        background: linear-gradient(to top right, #43389f 0%, #4ec6ca 100%);
        color: #fff;
        font-family: "Courier New", "Courier", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .center {
        position: absolute;
        top: 50.8%;
        left: 50.5%;
        transform: translate(-50%, -50%);
      }

      .number {
        position: relative;
        width: 200px;
        height: 100px;

        .one-one {
          position: absolute;
          top: 0;
          left: -16px;
          width: 20px;
          height: 40px;
          background: #fff;
          transform: rotate(50deg);
          border-radius: 3px;
          box-shadow: 0 0 13px 0 rgba(0, 0, 0, 0.3);
        }
        .one-two {
          position: absolute;
          top: 0;
          left: 0;
          width: 24px;
          height: 100px;
          background: #fff;
          border-radius: 3px;
          box-shadow: 0 0 13px 0 rgba(0, 0, 0, 0.2);
        }

        .zero-one,
        .zero-two {
          position: absolute;
          top: 0;
          left: 18px;
          width: 100px;
          height: 100px;
          border: 24px solid #fff;
          border-radius: 50%;
          box-shadow: 0 0 13px 0 rgba(0, 0, 0, 0.2);
        }
        .zero-two {
          left: 100px;
        }
      }

      .big {
        display: block;
        position: relative;
        font-size: 82px;
        line-height: 60px;
        text-transform: uppercase;
        font-weight: 700;
        margin-top: 6px;
      }

      .small {
        display: block;
        position: relative;
        font-size: 23px;
        line-height: 20px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="iframe">
      <div class="center">
        <div class="number">
          <div class="one-one"></div>
          <div class="one-two"></div>
          <div class="zero-one"></div>
          <div class="zero-two"></div>
        </div>
        <span class="big">Days</span>
        <span class="small">CSS Challenge</span>
      </div>
    </div>
  </body>
</html>
